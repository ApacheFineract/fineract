guarantor.loanId.positiveOrZero=Loan ID should be a positive number or zero.
guarantor.loanId.digits=Loan ID must not exceed 10 digits.

guarantor.locale.notBlank=Locale is required.
guarantor.locale.size=Locale must not exceed 50 characters.

guarantor.dateFormat.notBlank=Date format is required.
guarantor.dateFormat.invalid=Date format must be "dd MMMM yyyy" e.g. "01 January 1970".

guarantor.clientRelationshipTypeId.notNull=Client relationship type ID is required.
guarantor.clientRelationshipTypeId.positiveOrZero=Client relationship type ID should be a positive\
  \ number or zero.
guarantor.clientRelationshipTypeId.digits=Client relationship type ID must not exceed 10 digits.

guarantor.guarantorTypeId.notNull=Guarantor type ID is required.
guarantor.guarantorTypeId.positiveOrZero=Guarantor type ID should be a positive number or zero.
guarantor.guarantorTypeId.digits=Guarantor type ID must not exceed 10 digits.

guarantor.entityId.notNull=Entity ID is required.
guarantor.entityId.positiveOrZero=Entity ID should be a positive number or zero.
guarantor.entityId.digits=Entity ID must not exceed 10 digits.

guarantor.firstname.notBlank=First name is required.
guarantor.firstname.size=First name must not exceed 50 characters.

guarantor.lastname.notBlank=Last name is required.
guarantor.lastname.size=Last name must not exceed 50 characters.

guarantor.addressLine1.notBlank=Address Line 1 is required.
guarantor.addressLine1.size=Address Line 1 must not exceed 500 characters.

guarantor.addressLine2.size=Address Line 2 must not exceed 500 characters.

guarantor.city.notBlank=City is required.
guarantor.city.size=City must not exceed 50 characters.

guarantor.state.size=State must not exceed 50 characters.

guarantor.zip.notBlank=ZIP code is required.
guarantor.zip.size=Zip must not exceed 20 characters.

guarantor.country.size=Country must not exceed 20 characters.

guarantor.mobileNumber.notBlank=Mobile number is required.
guarantor.mobileNumber.invalid=Mobile number must be between 10 and 15 digits.

guarantor.housePhoneNumber.invalid=House phone number must be between 10 and 15 digits.

guarantor.comment.size=Comment must not exceed 500 characters.

guarantor.dob.notNull=Date of birth is required and must be in the format "dd MMMM yyyy" e.g. "01 January 1970".
guarantor.dob.validAge=Date of birth valid age range is from {min} years and {max} years inclusive.
guarantor.dob.invalidFormat=Date of birth format is invalid, it must be in the format "dd MMMM \
  yyyy" e.g. "01 January 1970".

guarantor.savingsId.positiveOrZero=Savings ID should be a positive number or zero.

guarantor.amount.min=Amount must be at least 0.01.
